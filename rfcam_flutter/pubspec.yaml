name: rfcam_flutter
description: Dazz-style film camera app. Fully offline, no accounts, all cameras free.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.10.3'
  flutter: '^3.38.4'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  flutter_shaders: ^0.1.3
  morphnext: ^0.6.1
  ficonsax: ^0.0.4
  cupertino_icons: ^1.0.5
  image: ^4.2.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  share_plus: ^13.3.0
  gal: ^2.3.3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/film/
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-ExtraBold.ttf
          weight: 800
  shaders:
    - shaders/film.frag
