<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 500px;
      background: radial-gradient(circle at 75% 50%, #1A1A22 0%, #0A0A0D 70%, #000000 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
      color: #FFFFFF;
      overflow: hidden;
      position: relative;
    }
    .left {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 520px;
      z-index: 2;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #FF7A2F;
      background: rgba(255, 122, 47, 0.15);
      border: 1px solid rgba(255, 122, 47, 0.3);
      padding: 4px 12px;
      border-radius: 6px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    h1 span { color: #FF7A2F; }
    p {
      font-size: 18px;
      color: #8E8E96;
      line-height: 1.45;
    }
    .right {
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 2;
    }
    .icon {
      width: 180px;
      height: 180px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 255, 255, 0.1) inset;
    }
  </style>
</head>
<body>
  <div class="left">
    <div class="badge">35mm Vintage Film Camera</div>
    <h1>12 Film Cameras.<br><span>In Your Pocket.</span></h1>
    <p>100% Offline • Real 35mm Grain • Zero Accounts</p>
  </div>
  <div class="right">
    <img src="../rfcam_flutter/assets/icon/rfcam_icon.png" class="icon" />
  </div>
</body>
</html>
